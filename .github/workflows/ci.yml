name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          python-version: "3.12.14"
      - name: Install locked backend dependencies
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run(['uv', 'sync', '--locked'], capture_output=True, text=True)
          output = result.stdout + result.stderr
          print(output)
          if result.returncode:
              # Public package install only; no secret values are passed to this step.
              diagnostic = output[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Locked dependency installation::' + diagnostic)
          raise SystemExit(result.returncode)
          PY
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python -m scripts.export_openapi --check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:resume
  databases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          python-version: "3.12.14"
      - name: Install locked backend dependencies
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run(['uv', 'sync', '--project', 'services/backend', '--locked'], capture_output=True, text=True)
          output = result.stdout + result.stderr
          print(output)
          if result.returncode:
              # Public package install only; no secret values are passed to this step.
              diagnostic = output[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Locked dependency installation::' + diagnostic)
          raise SystemExit(result.returncode)
          PY
      - name: Start the two local databases
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose.yaml up -d --wait --wait-timeout 120
      - name: Verify roles, isolation and independent migrations
        working-directory: services/backend
        run: |
          uv run python -m scripts.check_databases
          uv run alembic -c alembic-app.ini upgrade head
          uv run alembic -c alembic-jobs.ini upgrade head
      - name: Database logs
        if: failure()
        run: if [ -f .env ]; then docker compose --env-file .env -f infra/compose.yaml logs --no-color; fi
      - name: Stop CI services
        if: always()
        run: if [ -f .env ]; then docker compose --env-file .env -f infra/compose.yaml down; fi
