[project]
name = "ai-career-match-backend"
version = "0.1.0"
description = "Shared bootstrap; domain features are implemented by M1/M2/M3."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "alembic==1.19.2",
  "psycopg[binary]==3.3.5",
  # A-01 resume parsing (promoted from docs/resume/requirements-a01.txt by M3).
  "pypdf==6.17.0",
  "defusedxml==0.7.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
